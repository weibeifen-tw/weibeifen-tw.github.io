# 建置檢查（不部署）
# 用 GitHub Pages 官方的 Jekyll 建置工具建一次網站，確認沒有建置錯誤。
# - 手動觸發、推送 main／feat/*、或開 PR 到 main 時觸發（不部署；部署仍由 GitHub Pages 處理）
# - 權限只有 contents: read；不部署、不推送任何分支、不使用任何私密金鑰
# - 建置結果只留在這次執行的機器上，執行完就丟棄
name: 建置檢查（不部署）

on:
  workflow_dispatch:
  # 研究所 DEV-03：main 與「合併到 main 的 PR」也跑（strict）。注意：要成為發布關卡，還需要站長在 GitHub 設定分支保護＋必要檢查＋Pages 部署核准
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/member-entry-4-2
      - "feat/member-*"
      - "feat/site-*"
      - "feat/research-*"

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取得程式碼（唯讀，不保存憑證；含 tags，給核准簽章檢查）
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: T03 閱讀隔離假資料測試（僅 T03 分支，不部署）
        if: github.ref == 'refs/heads/feat/site-t03-reading-isolation' || (github.event_name == 'pull_request' && github.head_ref == 'feat/site-t03-reading-isolation')
        run: |
          node .dev/test-t03-reading.cjs
          node .dev/test-t03-rollback.cjs
          node .dev/test-t03-async-races.cjs

      - name: T03 Chromium 隔離瀏覽器整合（僅 T03 分支，不連正式後端）
        if: github.ref == 'refs/heads/feat/site-t03-reading-isolation' || (github.event_name == 'pull_request' && github.head_ref == 'feat/site-t03-reading-isolation') || github.ref == 'refs/heads/feat/site-t03-release-hardening-20261124' || (github.event_name == 'pull_request' && github.head_ref == 'feat/site-t03-release-hardening-20261124')
        run: |
          set -eu
          npm install --prefix .dev --ignore-scripts --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node .dev/test-t03-browser.cjs
          # V2.2：真正 app/member 閱讀頁、書櫃、會員頁，只使用本地假資料
          CHROME_PATH="$CHROME_PATH" node .dev/test-t03-page-integration.cjs

      - name: T03 V2.3 發布前唯讀安全守衛（僅隔離修復分支）
        if: github.ref == 'refs/heads/feat/site-t03-release-hardening-20261124' || (github.event_name == 'pull_request' && github.head_ref == 'feat/site-t03-release-hardening-20261124')
        run: |
          node .dev/test-t03-reading.cjs
          node .dev/test-t03-rollback.cjs
          node .dev/test-t03-async-races.cjs
          node .dev/test-t03-release-guard.cjs

      - name: G01 會員隱私隔離測試（假資料，不連正式 Supabase）
        if: github.ref == 'refs/heads/feat/site-t03-release-hardening-20261124' || (github.event_name == 'pull_request' && github.head_ref == 'feat/site-t03-release-hardening-20261124')
        run: |
          set -eu
          node .dev/test-g01-profile.cjs
          node .dev/test-g03-emergency.cjs
          node --check assets/auth.js
          node --check assets/member.js
          cid="$(docker run -d --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for i in $(seq 1 60); do docker exec "$cid" pg_isready -U postgres && break; sleep 1; done
          for f in .dev/g01-fixture.sql supabase/019_username_change_once.sql supabase/drafts/G01_01_profile_rpc_DRAFT.sql supabase/drafts/G01_02_profile_acl_DRAFT.sql .dev/g01-assertions.sql .dev/g02-reading-rls.sql; do
            docker exec -i "$cid" psql -X -U postgres -v ON_ERROR_STOP=1 < "$f"
          done

      - name: 研究文章資料驗證（只讀檔案，不需要套件）
        run: ruby .github/scripts/validate_literature.rb .

      - name: 小說章節發布驗證（只有站長授權的章節可以公開）
        run: ruby .github/scripts/validate_release.rb .

      - name: 原住民族專書：證據卡、歷史版本、撤回清單驗證
        run: ruby .github/scripts/validate_research.rb .

      - name: 核准基準（站長簽章 tag）檢查；main 與 PR 為 strict
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            ruby .github/scripts/verify_approvals.rb . --strict
          else
            ruby .github/scripts/verify_approvals.rb .
          fi

      - name: 從核准 SVG 封面產生 JPEG 社群分享圖（1200x630）
        run: |
          python3 -m venv /tmp/wb-og-venv
          /tmp/wb-og-venv/bin/python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==12.0.0"
          /tmp/wb-og-venv/bin/python .github/scripts/generate_novel_og.py

      - name: Jekyll 建置（GitHub Pages 官方工具）
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: 檢查建置結果
        run: |
          set -e
          for f in index.html member/index.html shelf/index.html about/index.html auth/callback/index.html login-test/index.html assets/member.js assets/auth.js; do
            test -f "_site/$f" || { echo "缺少 _site/$f"; exit 1; }
            echo "OK  $f"
          done
          test ! -e _site/supabase || { echo "supabase/ 不應被發布"; exit 1; }
          echo "OK  supabase/ 未被發布"
          n=$(grep -c 'class="d-item d-account"' _site/index.html); echo "選單個人資料入口：$n"; test "$n" = "1"
          n=$(grep -o 'class="bk"' _site/index.html | wc -l); echo "首頁書架小說：$n"; test "$n" -gt 0
          n=$(grep -c 'assets/member.js' _site/member/index.html); echo "會員頁 member.js 載入次數：$n"; test "$n" = "1"
          n=$(grep -o 'id="member-default-avatar"' _site/member/index.html | wc -l); echo "會員頁頭像模板數：$n"; test "$n" = "1"
          if grep -rqE 'sb_secret_[A-Za-z0-9]{8,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' _site --include=*.html --include=*.js; then echo "發現疑似私密金鑰"; exit 1; fi
          echo "OK  未發現私密金鑰"
          # 山海有痕：作品頁與 32 章
          test -f _site/novel/shanhai/index.html || { echo "缺少山海有痕作品頁"; exit 1; }
          n=$(ls _site/t | grep -c '^shanhai[0-9][0-9]$'); echo "山海有痕章節：$n"; test "$n" = "32"
          if ls _site | grep -qiE '\.(docx|xlsx|zip)$' || find _site -iname '*.docx' -o -iname '*.xlsx' -o -iname '*.zip' | grep -q .; then echo "發現不應公開的原始檔"; exit 1; fi
          echo "OK  未發布原始文件"

      - name: T03 閱讀隔離建置產物檢查（僅 T03 分支）
        if: github.ref == 'refs/heads/feat/site-t03-reading-isolation' || (github.event_name == 'pull_request' && github.head_ref == 'feat/site-t03-reading-isolation') || github.ref == 'refs/heads/feat/site-t03-release-hardening-20261124' || (github.event_name == 'pull_request' && github.head_ref == 'feat/site-t03-release-hardening-20261124')
        run: |
          set -eu
          test -f _site/assets/js/reading-store.js
          grep -q 'assets/js/reading-store.js' _site/index.html
          grep -q 'assets/js/reading-store.js' _site/shelf/index.html
          grep -q 'assets/js/reading-store.js' _site/member/index.html
          echo 'OK T03 reading-store published before dependent scripts (source layout)'
          node --check _site/assets/js/reading-store.js
          node --check _site/assets/app.js
          node --check _site/assets/cloud.js
          node --check _site/assets/member.js
          node .dev/test-t03-rendered-pages.cjs
          node .dev/test-g03-emergency.cjs _site/assets/cloud.js

      - name: 作品及章節 SEO 與 JPEG 分享圖驗收
        run: ruby .github/scripts/validate_novel_seo.rb . --site _site

      - name: 建置輸出檢查：已授權章節都在、未授權章節沒有出現
        run: ruby .github/scripts/validate_release.rb . --site _site

      - name: P3-01-A 公開章節／撤回狀態索引驗證（不部署）
        run: ruby .github/scripts/validate_chapter_status.rb . --site _site

      - name: V3 作品媒體模組瀏覽器回歸驗證
        run: |
          set -eu
          node --check _site/assets/js/novel-media.js
          npm install --prefix .dev --ignore-scripts --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node .dev/test-v3-novel-media.cjs

      - name: V3 閱讀模組隔離回歸
        run: |
          set -eu
          node --check _site/assets/js/novel-reading.js
          grep -q 'assets/js/novel-reading.js' _site/t/shanhai01/index.html
          ! grep -q 'assets/js/novel-reading.js' _site/index.html
          ! grep -q 'assets/js/novel-reading.js' _site/member/index.html
          ! grep -q 'assets/js/novel-reading.js' _site/novel/shanhai/index.html
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node .dev/test-t03-page-integration.cjs
