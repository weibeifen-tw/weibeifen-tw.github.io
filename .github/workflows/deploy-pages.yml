# 正式部署（2026-11-22 啟用）。前提：Settings → Pages → Source＝GitHub Actions；說明見 docs/research/release-plan.md。
# 設計重點：
#   - 發布關卡＝部署前的 strict 驗證：研究文章必須有站長簽章的核准 tag，否則整次部署失敗、網站維持舊版
#   - 小說章節：站長手動執行「排程發章」→ 它用內建權杖推 main（這種推送不會觸發其他工作流程），
#     所以這裡用 workflow_run 在「排程發章」成功跑完後部署
#   - 一般推送 main、手動按，也會部署
name: 部署網站（研究文章需站長簽章核准）
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["排程發章", "發布章節"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # workflow_run：只在「排程發章」「發布章節」成功時部署
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, fetch-tags: true, persist-credentials: false }
      - run: ruby .github/scripts/validate_literature.rb .
      - run: ruby .github/scripts/validate_research.rb .
      - run: ruby .github/scripts/verify_approvals.rb . --strict
      - run: ruby .github/scripts/validate_release.rb .
      - name: 從核准 SVG 封面產生 JPEG 社群分享圖（1200x630）
        run: |
          python3 -m venv /tmp/wb-og-venv
          /tmp/wb-og-venv/bin/python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==12.0.0"
          /tmp/wb-og-venv/bin/python .github/scripts/generate_novel_og.py

      - uses: actions/jekyll-build-pages@v1
        with: { source: ./, destination: ./_site }
      - name: 作品及章節 SEO 與 JPEG 分享圖驗收
        run: ruby .github/scripts/validate_novel_seo.rb . --site _site

      - name: 建置輸出檢查：已授權章節都在、未授權章節沒有出現
        run: ruby .github/scripts/validate_release.rb . --site _site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
