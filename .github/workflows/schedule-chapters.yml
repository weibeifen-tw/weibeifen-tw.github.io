name: 排程發章

# 2026-11-22 站長決定：小說章節由站長決定何時發布，不再每天自動發布。
#   - 已停用每日定期觸發；只能在 Actions 頁面手動執行（workflow_dispatch）。
#   - 用法：把章節檔放進 .github/scheduled/上線日期/，到了想發的那天，由站長在 Actions 頁面按「Run workflow」，
#     日期已到的章節會搬進 _posts/。搬完後「部署網站」工作流程會在這裡跑完後自動部署（含研究文章驗證）。
#   - 手動執行＝站長授權：搬進 _posts 的章節會自動加進 .github/release/authorized.txt。
#   - 章節檔名裡的日期是故事時間，不影響是否公開（_config.yml future: true）。

on:
  workflow_dispatch:         # 只能手動執行

permissions:
  contents: write

concurrency:
  group: schedule-chapters
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 把到期的章節搬進 _posts
        id: move
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          moved=0
          shopt -s nullglob
          for dir in .github/scheduled/*/; do
            day=$(basename "$dir")
            if [[ "$day" > "$TODAY" ]]; then continue; fi
            for f in "$dir"*.md; do
              git mv "$f" "_posts/$(basename "$f")"
              basename "$f" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//; s/\.(md|markdown|html)$//' >> .github/release/authorized.txt
              echo "上線：$(basename "$f")"
              moved=$((moved+1))
            done
          done
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

      - name: 推上去
        if: steps.move.outputs.moved != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .github/release/authorized.txt
          ruby .github/scripts/validate_release.rb .
          git commit -m "排程發章：${{ steps.move.outputs.moved }} 章上線"
          git pull --rebase
          git push

      # 舊式「請 GitHub Pages 重建網站」已移除：改由 .github/workflows/deploy-pages.yml 在本工作流程完成後部署
