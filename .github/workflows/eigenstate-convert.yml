name: 本徵態原圖轉檔
on:
  push:
    branches: [feat/site-eigenstate-001-040]
    paths: ['.github/workflows/eigenstate-convert.yml']
permissions:
  contents: write
jobs:
  convert:
    if: github.ref == 'refs/heads/feat/site-eigenstate-001-040'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==12.0.0
      - name: 轉換五張指定原圖
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pairs = {
              'assets/comics/作品頁第一張貼文圖。_窗邊低語：弦與沁.png': 'assets/comics/eigenstate-1.webp',
              'assets/comics/作品頁第二張貼文圖_書桌燈下的溫柔依偎.png': 'assets/comics/eigenstate-2.webp',
              'assets/comics/作品頁第三張貼文圖_夜幕下的溫柔相吻.png': 'assets/comics/eigenstate-3.webp',
              'assets/stories/沁的角色限動_綁頭髮_紫色溶液與實驗室凝視.png': 'assets/stories/eigenstate-qin.webp',
              'assets/stories/弦的角色限動_窗邊靜謐閱讀時光.png': 'assets/stories/eigenstate-xian.webp',
          }
          for src, dst in pairs.items():
              with Image.open(src) as im:
                  assert im.format == 'PNG'
                  im.convert('RGB').resize((900,1125),Image.Resampling.LANCZOS).save(dst,'WEBP',quality=92,method=6)
              with Image.open(dst) as im:
                  assert im.format == 'WEBP' and im.size == (900,1125)
                  im.load()
              print(dst, Path(dst).stat().st_size)
          PY
      - name: 提交轉檔結果到原分支
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/comics/eigenstate-{1,2,3}.webp assets/stories/eigenstate-{qin,xian}.webp
          if ! git diff --cached --quiet; then
            git commit -m '本徵態五張原圖轉為 WebP 900x1125 Q92'
            git push origin HEAD:feat/site-eigenstate-001-040
          fi
