# 研究所自我測試（只在研究開發分支或手動執行；不部署、不推送、權限唯讀）
# 在臨時機器上產生假資料 → 用 GitHub 的 git 測 SSH 簽章核准 → 用 GitHub Pages 官方 Jekyll 建置 → 檢查網站地圖、註腳等
name: 研究所自我測試（不部署）
on:
  workflow_dispatch:
  push:
    branches: ["feat/research-*", "feat/site-release-*"]
permissions:
  contents: read
concurrency:
  group: research-selftest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: 小說發布制度：未授權章節一律擋下（臨時測試章節，只在這台機器）
        run: |
          set -u
          printf -- '---\nlayout: thread\ntitle: 測試未授權\ncharacter: qin\nnovel: hongdian\nchapter: 98\n---\nZZLEAKTESTA\n' > _posts/2030-01-01-leaktesta.md
          if ruby .github/scripts/validate_release.rb .; then echo "失敗：未授權、未標 published: false 的章節沒有被擋"; exit 1; else echo "通過 沒有授權的章節被擋下（部署前）"; fi
          rm _posts/2030-01-01-leaktesta.md
          printf -- '---\nlayout: thread\ntitle: 測試保留章節\ncharacter: qin\nnovel: hongdian\nchapter: 99\npublished: false\nrelease_at: 2030-01-01T20:00:00+08:00\n---\nZZLEAKTESTB 這段文字不得出現在網站輸出\n' > _posts/2030-01-01-leaktestb.md
          ruby .github/scripts/validate_release.rb . && echo "通過 published: false 的保留章節驗證通過（不公開）"
      - name: 正式正文與站長簽章嚴格驗證（原始 checkout）
        run: |
          set -eu
          ruby .github/scripts/validate_literature.rb .
          ruby .github/scripts/validate_research.rb .
          ruby .github/scripts/verify_approvals.rb . --strict
      - name: 隔離正式文章及核准標籤（僅唯讀 CI 的臨時 checkout）
        run: |
          set -eu
          git ls-files '_literature/indigenous-*.md' | while IFS= read -r f; do rm -- "$f"; done
          git tag --list 'ind/*' | while IFS= read -r t; do git tag -d "$t"; done
          rm -f .github/approver/allowed_signers
      - name: 產生假資料並本機 commit（不推送）
        run: |
          ruby .github/scripts/research_fixture.rb .
          git config user.name selftest; git config user.email selftest@example.invalid
          git add -A && git -c commit.gpgsign=false commit -qm "selftest fixture (local only)"
      - name: 驗證規則
        run: |
          ruby .github/scripts/validate_literature.rb .
          ruby .github/scripts/validate_research.rb .
      - name: SSH 簽章核准機制（拋棄式金鑰，只在這台機器）
        run: |
          set -u
          ssh-keygen -q -t ed25519 -N "" -C approver -f "$RUNNER_TEMP/k"
          ssh-keygen -q -t ed25519 -N "" -C intruder -f "$RUNNER_TEMP/x"
          sha() { ruby -E UTF-8:UTF-8 -rdigest -e 'b=File.read(ARGV[0]).split(/^---\s*$/,3)[2];puts Digest::SHA256.hexdigest(b.gsub(/\s+/,""))' "$1"; }
          sign() { git -c gpg.format=ssh -c gpg.ssh.program=ssh-keygen -c user.signingkey="$1" tag -f -s "$2" -m "$(printf 'article_id: %s\nversion: %s\nbody_sha256: %s' "$3" "$4" "$5")" >/dev/null; }
          expect() { if ruby .github/scripts/verify_approvals.rb . --strict >/tmp/o.txt 2>&1; then r=pass; else r=FAIL; fi; if [ "$r" = "$1" ]; then echo "通過 $2（$r）"; else echo "失敗 $2：預期 $1 實際 $r"; cat /tmp/o.txt; exit 1; fi; }
          A=_literature/ind-test-a.md; B=_literature/ind-test-b.md; V=_lit_versions/ind-test-a/v1.0.md
          expect FAIL "1 沒有公鑰、沒有 tag → 擋下"
          echo "selftest@example.invalid namespaces=\"git\" $(cat $RUNNER_TEMP/k.pub)" > .github/approver/allowed_signers
          expect FAIL "2 有公鑰但文章未核准（沒有 tag）→ 擋下"
          sign "$RUNNER_TEMP/k" ind/IND-1-01-01/v2.0 IND-1-01-01 v2.0 "$(sha $A)"
          sign "$RUNNER_TEMP/k" ind/IND-1-01-02/v2.0 IND-1-01-02 v2.0 "$(sha $B)"
          sign "$RUNNER_TEMP/k" ind/IND-1-01-01/v1.0 IND-1-01-01 v1.0 "$(sha $V)"
          expect pass "3 全部由站長金鑰簽章 → 通過"
          sign "$RUNNER_TEMP/x" ind/IND-1-01-02/v2.0 IND-1-01-02 v2.0 "$(sha $B)"
          expect FAIL "4 用別把金鑰簽（無效簽章）→ 擋下"
          git tag -f -a ind/IND-1-01-02/v2.0 -m "article_id: IND-1-01-02" --no-sign >/dev/null
          expect FAIL "5 沒有簽章的 tag → 擋下"
          sign "$RUNNER_TEMP/k" ind/IND-1-01-02/v2.0 IND-1-01-02 v2.0 "$(sha $B)"
          expect pass "6 恢復正確簽章 → 通過"
          sed -i 's/第一段測試文字/第一段被偷改/' $V
          ruby -E UTF-8:UTF-8 -rdigest -e 'f=ARGV[0];s=File.read(f);b=s.split(/^---\s*$/,3)[2];File.write(f,s.sub(/body_sha256: \h+/,"body_sha256: "+Digest::SHA256.hexdigest(b.gsub(/\s+/,""))))' $V
          ruby .github/scripts/validate_research.rb . >/dev/null && echo "（repo 內指紋已被重算，同 repo 檢查會通過）"
          expect FAIL "7 改舊版正文並重算指紋 → 簽章基準擋下"
          git checkout -q -- $V
          expect pass "8 還原舊版 → 通過"
      - name: BUILD07 閱讀隔離與研究前端語法回歸（不連正式後端）
        run: |
          set -eu
          node .dev/test-t03-reading.cjs
          node .dev/test-t03-rollback.cjs
          node .dev/test-t03-async-races.cjs
          for f in assets/js/research-member.js assets/js/research-errata.js assets/js/lit-research.js assets/js/reading-store.js assets/app.js assets/cloud.js; do node --check "$f"; done
      - name: GitHub Pages 官方 Jekyll 建置（含假資料）
        uses: actions/jekyll-build-pages@v1
        with: { source: ./, destination: ./_site }
      - name: 檢查正式輸出：網站地圖、註腳、證據卡、歷史版本、撤回、搜尋
        run: ruby .github/scripts/research_site_check.rb _site

      - name: BUILD07 桌機手機研究頁瀏覽器回歸（僅本機假資料）
        run: |
          set -eu
          npm install --prefix "$RUNNER_TEMP/research-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.51.1
          export NODE_PATH="$RUNNER_TEMP/research-browser/node_modules"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          node .dev/test-t03-browser.cjs
          node .dev/test-t03-page-integration.cjs
          node .dev/test-research-browser.cjs _site

      - name: 小說發布制度：保留章節沒有出現在任何網站輸出（頁面、搜尋、sitemap、posts.json、作品目錄）
        run: |
          ruby .github/scripts/validate_release.rb . --site _site
          if grep -rl "ZZLEAKTESTB\|leaktestb\|測試保留章節" _site; then echo "失敗：保留章節出現在網站輸出"; exit 1; fi
          test ! -e _site/t/leaktestb && echo "通過 保留章節在整個 _site 找不到（含 sitemap、search.json、posts.json、作品頁目錄）"
          for s in hongdian09 hongdian10 yang10 exam39; do test -f _site/t/$s/index.html && grep -q "/t/$s/" _site/sitemap.xml && grep -q "\"$s\"" _site/assets/posts.json && echo "通過 $s 有頁面、在 sitemap、在索引"; done
