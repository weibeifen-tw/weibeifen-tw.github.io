name: 手機會員卡片規格檢查（不部署）
on:
  push:
    branches: [feat/site-member-mobile-cards-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate admin JavaScript syntax
        run: node --check assets/admin.js
      - name: Validate mobile member UI contract
        run: node --test tests/member-mobile-cards.test.mjs
