name: 手機會員卡片規格檢查（不部署）
on:
  push:
    branches: [feat/site-member-mobile-cards-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate admin JavaScript syntax
        run: node --check assets/admin.js
      - name: Validate mobile member UI contract
        run: node --test tests/member-mobile-cards.test.mjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Check 320–1440px layouts, modal focus and mocked ban confirmation
        run: node tests/member-mobile-browser.mjs
