# 每個角色一段。id 用英文，貼文裡的 character: 要對得上。
# avatar：放在 assets/avatars/ 的圖檔名；沒有圖就會顯示 glyph 那個字。
# 以下都可以不填，不填就不顯示：
#   pin：置頂一句話；pin_ch：那句話在第幾章
#   eras：跟著年份變的簡介，每筆 year + bio（章節頁會顯示「那一年的她」）
#   items：她的東西，每筆 name + note，ch 填第一次出現的章節（同一本小說的章節編號）
#   skip：自動點名時要跳過的詞（例如「秀禾」裡的「禾」不算點名）
mo:
  name: 模
  handle: mo.unbacked
  novel: yu
  avatar: mo.svg
  glyph: 模
  color: "#b9653f"
  bio: 大里長大，花蓮念書，回臺中工作。小時候怕球，但喜歡踢。
taro:
  name: 芋
  handle: taro.morning
  novel: market
  avatar: taro.svg
  glyph: 芋
  color: "#7a6a9e"
  bio: 三十一歲，在臺中的老市場賣菜。四點半起床，番茄放最旁邊。
yang:
  name: 陽
  handle: yang.coffee
  novel: market
  avatar: yang.svg
  glyph: "365"
  color: "#d98a2b"
  bio: 臺北來的，在臺中市場口開咖啡廳。番茄硬的切片，軟的煮醬。
lin:
  name: 林
  handle: LIN.YA
  avatar: lin.svg
  novel: feichang
  glyph: 林
  color: "#4f6d7a"
  bio: 頭髮一直都是短的。彰化念藝術系，現在在臺中。
wu:
  name: 吳
  handle: WWW.U
  novel: feichang
  avatar: wu.svg
  glyph: 吳
  color: "#c27c8e"
  bio: 做狗狗娃娃。不太出門，除了拍照。
chuan:
  name: 川
  handle: chuan.5000m
  novel: gongdi
  avatar: chuan.svg
  glyph: 川
  color: "#3f6b8a"
  bio: 興大附農機電科。155 公分，長頭髮，每天跑五公里。量東西要量十次。
qin:
  name: 秦
  handle: qin.and.xu
  novel: hongdian
  avatar: qin.svg
  glyph: 秦
  color: "#c8423a"
  bio: 情侶帳號「秦與栩，收音中」。拍她，也拍她看她的樣子。
cheng:
  name: 澄
  handle: cheng.tenseconds
  novel: hue
  avatar: cheng.svg
  glyph: 澄
  color: "#8b5e6b"
  bio: 二十五歲，在城西境的禮儀社工作。看得到別人身上的顏色，看不到自己的。
xi:
  name: 晞
  handle: xi.fourcolors
  novel: exam
  avatar: xi.svg
  glyph: 晞
  color: "#5b6b8c"
  bio: 二十四歲，政大公行，第二次考高考一般行政。差 1.80 分。螢光筆分四色，每天第一個到自習室。
tu:
  name: 荼
  handle: tu.koujue
  novel: exam
  avatar: tu.svg
  glyph: 荼
  color: "#b5653a"
  bio: 二十七歲，屏東潮州人，第三次考高考法制。住南陽街附近的四坪雅房，一天一百五。很會編順口溜。
shuang:
  name: 霜
  handle: frostline
  novel: yincang
  avatar: shuang.svg
  story: /assets/stories/yincang-shuang.webp
  glyph: 霜
  color: "#7d8fa3"
  bio: 二十四歲，嘉義市人，雲科大設計系畢業，在廣告社畫招牌。PTT 帳號 frostline，網聚永遠帶骰子。
di:
  name: 堤
  handle: di.beigang
  novel: yincang
  avatar: di.svg
  story: /assets/stories/yincang-di.webp
  glyph: 堤
  color: "#4b5260"
  bio: 二十七歲，雲林北港人，健身教練，一七六。騎一台黑色 KTR。菸戒了，手上還是要拿一根。
shi:
  name: 拾
  handle: shi.timeline
  novel: shiyi
  avatar: shi.svg
  glyph: 拾
  color: "#8a6a4f"
  bio: 十六歲，中興高中高一。住在中興新村的省府宿舍，筆記抄得比誰都完整。
jian:
  name: 澗
  handle: jian.deadline
  novel: chaojian
  avatar: jian.svg
  glyph: 澗
  color: "#3f5a6b"
  bio: 二十七歲，基隆人，報關員。白天跟期限打架，晚上只想安靜。已讀太久會想很多，先說抱歉。
isle:
  name: 嶼
  handle: isle.figures
  novel: chaojian
  avatar: isle.svg
  glyph: 嶼
  color: "#a35a6a"
  bio: 二十二歲，剛從倫敦回來被疫情困住，在仁愛區開了一間沒什麼人的公仔店。看心情回訊息。
shan:
  name: 杉
  handle: shan.beats
  novel: weigongkai
  avatar: shan.svg
  glyph: 杉
  color: "#a0613a"
  bio: 二十五歲，送外送，也在樂團打鼓。不會說謊，來上節目是因為通告費很好。
ji:
  name: 霽
  handle: ji.afterrain
  novel: weigongkai
  avatar: ji.svg
  glyph: 霽
  color: "#5d6474"
  bio: 二十七歲，室內設計助理。話很少，想很多。睡不著的時候會去洗碗。
tai:
  name: 苔
  handle: tai.process
  novel: weigongkai
  avatar: tai.svg
  glyph: 苔
  color: "#76698a"
  bio: 二十九歲，中科半導體製程工程師。話不多，社交電量很低。來上節目是想談戀愛，認真的。
feng:
  name: 楓
  handle: feng.onstage
  novel: weigongkai
  avatar: feng.svg
  glyph: 楓
  color: "#b5473c"
  bio: 二十三歲，剛從舞蹈系畢業。看狗狗影片也會哭。來上節目是想交朋友。
jue:
  name: 蕨
  handle: jue.napping
  novel: weigongkai
  avatar: jue.svg
  glyph: 蕨
  color: "#9a7658"
  bio: 三十四歲，國中老師，放暑假。什麼都慢，總是在打哈欠。來上節目是因為暑假沒事。
xiu:
  name: 岫
  handle: xiu.mountainside
  novel: weigongkai
  avatar: xiu.svg
  glyph: 岫
  color: "#46557e"
  bio: 二十二歲，仁愛鄉人，在臺中讀中興大學。對誰都很有禮貌，問她是哪裡人，她會說在臺中讀書。
linrain:
  name: 霖
  handle: lin.shipper
  novel: weigongkai
  avatar: linrain.svg
  glyph: 霖
  color: "#bf862f"
  bio: 二十六歲，護理師，輪班輪到崩潰。來上節目是為了好好睡覺跟看戲。房間白板上的 CP 圖每天更新。
ai:
  name: 靄
  handle: ai.slowmorning
  novel: weigongkai
  avatar: ai.svg
  glyph: 靄
  color: "#b07c74"
  bio: 三十一歲，以前拍生活影片，煮咖啡、買花、在陽台看書。來上節目是想認識新朋友，也想讓自己慢下來。
yuan:
  name: 垣
  handle: yuan.spike
  novel: chuwang
  avatar: yuan.svg
  glyph: 垣
  color: "#8c4a5e"
  bio: 國企系，臺中人。系排攻擊手，長髮及肩，打球綁馬尾。每一球打壞，都會先說對不起。
heng:
  name: 蘅
  handle: heng.sundayporridge
  novel: mizi
  avatar: heng.svg
  glyph: 蘅
  color: "#b38e72"
  bio: 三十三歲，中文系助理教授，出過兩本詩集。五個孩子的媽媽、一個人的妻。每天早上五點寫字，那一小時是她自己的。
yin:
  name: 茵
  handle: yin.firstyear
  novel: pendi
  avatar: yin.svg
  glyph: 茵
  color: "#c08497"
  bio: 十六歲，高一。這個夏天才發現自己喜歡女生，在脆上找到鎮上的群，第一次見面緊張到提早半小時到。
jin:
  name: 燼
  handle: jin.ashes
  novel: pendi
  avatar: jin.svg
  glyph: 燼
  color: "#9a4f3c"
  bio: 二十歲。話很多，認識的人也很多。鎮上誰跟誰在一起，她都知道。
ting:
  name: 汀
  handle: ting.notbufen
  novel: pendi
  avatar: ting.svg
  glyph: 汀
  color: "#56698c"
  bio: 十七歲，高二。T，很在意這件事。嘴很硬，騎腳踏車載過半個群的人回家。
kui:
  name: 葵
  handle: kui.halfsugar
  novel: pendi
  avatar: kui.svg
  glyph: 葵
  color: "#c98a3e"
  bio: 十九歲，在家裡的筊白筍田跟鎮上飲料店之間打工。燼的 cos 搭檔，負責縫衣服，也負責叫她吃飯。
jing:
  name: 菁
  handle: jing.taichung
  novel: pendi
  avatar: jing.svg
  glyph: 菁
  color: "#8a6f9e"
  bio: 十八歲，剛去臺中讀大學，週末才回埔里。淡棕色頭髮，寬褲。群裡最冷靜的人。
yan:
  name: 焰
  handle: huoyan.zhanshen
  novel: shuangshuang
  avatar: yan.svg
  glyph: 焰
  color: "#d0622b"
  bio: 二十六歲，古坑瓦斯行的女兒，一次搬兩桶二十公斤。我爸說他沒生到兒子，但他有我。
xiao:
  name: 硝
  handle: xiao.lieyu
  novel: duanqiao
  avatar: xiao.svg
  glyph: 硝
  color: "#8b3a2a"
  bio: 三十二歲，烈嶼守備隊長。退伍軍人，左臉到脖子有燒傷。住上林古厝，不太講話。
ying:
  name: 霙
  handle: ying.shuitou
  novel: duanqiao
  avatar: ying.svg
  glyph: 霙
  color: "#6f84a8"
  bio: 二十四歲，大金首領的女兒，災變第三年被送到烈嶼當人質。什麼都說好。
jiao:
  name: 礁
  handle: jiao.kaiyuan
  novel: huaji
  avatar: jiao.svg
  glyph: 礁
  color: "#4a5a70"
  bio: 蘭嶼長大。短頭髮是我爸要我剪的。話不多，但我都有在聽。
yi:
  name: 漪
  handle: yi.minsu
  novel: huaji
  avatar: yi.svg
  glyph: 漪
  color: "#b07a8f"
  bio: 蘭嶼長大，家裡開民宿。讀書很慢，會畫很多重點。
xiwei-jin:
  name: 矜
  handle: jin.seat
  novel: xiwei
  avatar: xiwei-jin.svg
  glyph: 矜
  color: "#4a3f5c"
  bio: 三十五歲，無黨籍嘉義市議員。議會裡有我的名牌，家裡餐桌靠窗那張椅子，從來不是我的。
xiwei-he:
  name: 禾
  handle: he.recorder
  novel: xiwei
  avatar: xiwei-he.svg
  glyph: 禾
  color: "#b0623f"
  bio: 二十九歲，嘉義地方記者。錄音筆打開的時候，我不會因為欣賞一個人，就少問一題。
chaosheng-cheng:
  name: 澄
  handle: cheng.archive
  novel: chaosheng
  avatar: chaosheng-cheng.svg
  glyph: 澄
  color: "#3d4f78"
  bio: 二十九歲，歷史研究員，在南竿整理地方文獻。證據不足的事，我不下結論。
chaosheng-xi:
  name: 晞
  handle: xi.tidevoice
  novel: chaosheng
  avatar: chaosheng-xi.svg
  glyph: 晞
  color: "#c8604e"
  bio: 二十八歲，南竿出生，在地方文化工作室做口述歷史。島上每個人的故事，我都想聽完。
houdiao-mu:
  name: 沐
  handle: mu.cedar
  novel: houdiao
  avatar: houdiao-mu.svg
  glyph: 沐
  color: "#8a6a52"
  bio: 二十七歲，獨立調香師，女性 Alpha。台大化學系，習慣喝便利商店的白茶。身上是雪松和白茶的味道。
houdiao-lian:
  name: 斂
  handle: lian.xu
  novel: houdiao
  avatar: houdiao-lian.svg
  glyph: 斂
  color: "#3f3a5a"
  bio: 三十二歲，香水品牌「序」的創辦人，女性 Omega。不喜歡甜膩的香調，也不喜歡被低估。
mu:
  name: 畝 MU
  handle: weibe.ifen
  novel: ""
  avatar: mu.webp
  glyph: 畝
  color: "#d97a3a"
  bio: 未備份的作者。有話想說，可以直接傳訊息給我。
# 《山海有痕》：主角霧、刃；support: true 是配角（作品頁「認識角色」放在主角下方，不做分頁）。
# story：角色專屬限動圖，點頭像才載入；不能當頭像。says：網站新撰的自我介紹，不是正文引句。
shanhai-wu:
  name: 霧
  handle: wu.stone
  novel: shanhai
  avatar: shanhai-wu.svg
  glyph: 霧
  color: "#5d6b78"
  story: /assets/stories/shanhai-wu.webp
  bio: 十九歲，160 公分，嶺族祭司。黑色長直髮，身形纖瘦。沉靜、克制，能透過石頭感知過往的記憶。習慣承擔族人的責任，卻很少說出自己的感受。
  says: 我是霧。石頭有時會留下人的聲音，但我聽見的，不一定是事情的全部。
shanhai-ren:
  name: 刃
  handle: ren.tide
  novel: shanhai
  avatar: shanhai-ren.svg
  glyph: 刃
  color: "#a64236"
  story: /assets/stories/shanhai-ren.webp
  bio: 二十歲，167 公分，潮族獵人。黑色及肩髮，身形高挑精實，右膝留有舊傷。警覺而堅韌，擅長狩獵與辨認地形，重視承諾及自主選擇。
  says: 我是刃。走過的路，我會記得。但下一步往哪走，我想自己決定。
shanhai-he:
  name: 禾
  handle: he.flake
  novel: shanhai
  support: true
  avatar: shanhai-he.svg
  glyph: 禾
  color: "#8a6a3f"
  story: /assets/stories/shanhai-he.webp
  bio: 嶺族石器製作者。霧的親近同伴，擅長製作石器。關心身邊的人，經常以直接的言語與實際行動照顧霧。
  says: 我是禾。石片敲壞了就再做一塊，人累了，就該停下來吃點東西。
shanhai-huai:
  name: 槐
  handle: huai.ridge
  novel: shanhai
  support: true
  avatar: shanhai-huai.svg
  glyph: 槐
  color: "#7a6656"
  story: /assets/stories/shanhai-huai.webp
  bio: 嶺族成員。關心霧的身體與安危，理解讀石能力所帶來的負擔。在族群的需求與霧的處境之間，有自己的判斷。
  says: 我是槐。不知道所有事情，也不代表我們什麼都做不了。
shanhai-yan:
  name: 巖
  handle: yan.cliff
  novel: shanhai
  support: true
  avatar: shanhai-yan.svg
  glyph: 巖
  color: "#5e5650"
  story: /assets/stories/shanhai-yan.webp
  bio: 嶺族重要決策者。重視族群的生存與安全，參與道路、資源及族人行動的決策。
  says: 我是巖。我要知道前面的路能不能走，還有出去的人能不能回來。
shanhai-jiao:
  name: 礁
  handle: jiao.reef
  novel: shanhai
  support: true
  avatar: shanhai-jiao.svg
  glyph: 礁
  color: "#4f6470"
  story: /assets/stories/shanhai-jiao.webp
  bio: 潮族領袖，刃的父親。肩負潮族的生存責任，在族群利益、資源與親情之間面對不同的選擇。
  says: 我是礁。海邊的人需要食物，也需要一處能安心過夜的地方。
shanhai-ling:
  name: 翎
  handle: ling.feather
  novel: shanhai
  support: true
  avatar: shanhai-ling.svg
  glyph: 翎
  color: "#94584a"
  story: /assets/stories/shanhai-ling.webp
  bio: 潮族成員。與刃相識已久，兩人擁有共同的過往。她的選擇與族群立場，使這段關係並不單純。
  says: 我是翎。有些事情，並不像我們當初想的那麼容易。
shanhai-quan:
  name: 泉
  handle: quan.spring
  novel: shanhai
  support: true
  avatar: shanhai-quan.svg
  glyph: 泉
  color: "#a8744a"
  story: /assets/stories/shanhai-quan.webp
  bio: 潮族孩童。對周遭事物充滿好奇，喜歡嘗試製作石片。她對其他人的認識，往往來自親眼所見，而非族群之間的成見。
  says: 我是泉。今天又敲出了一塊石片，這次沒有碎成好幾塊！
shanhai-lan:
  name: 嵐
  handle: lan.hunter
  novel: shanhai
  support: true
  avatar: shanhai-lan.svg
  glyph: 嵐
  color: "#66708a"
  story: /assets/stories/shanhai-lan.webp
  bio: 潮族獵人。刃的狩獵同伴，參與探路、救援及族群遷移，在危險環境中與其他獵人相互協助。
  says: 我是嵐。路不好走的時候，別忘了看看後面的人有沒有跟上。
