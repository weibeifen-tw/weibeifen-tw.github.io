research:
  - id: changbin-culture
    title: 長濱文化
    phase: paleolithic
    period: 約距今30,000年起，屬於臺灣舊石器時代的考古文化。
    novel: shiyi
    chapter: 4
    source: https://nchdb.boch.gov.tw/assets/overview/archaeologicalSite/20060501000007

  - id: dabenkeng-culture
    title: 大坌坑文化
    phase: neolithic
    period: 約距今6,500至4,200年，屬於臺灣新石器時代早期的考古文化。
    novel: shiyi
    chapter: 4
    source_title: 館藏臺灣西部大坌坑文化陶片刻劃紋研究
