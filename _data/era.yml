# 年代誌（P04-2 核准版）
# 只收小說正文實際提到、而且可以查證的臺灣歷史事件；流行文化、架空設定、還沒發生的事都不放。
# 架空說明放在各小說介紹頁（novels.yml 的 world_note / fiction_note），不放這裡。
#
# events：近現代事件，每筆只存一次。
#   start / end：起訖年份（數字）。只有一年的事件 end 可以省略。
#   跨年代的事件（例如 1956–1992）會自動出現在每一個相關的十年區塊。
#   date：顯示用的日期文字。
#   category：experience＝親身經歷（角色自己經歷）、retrospective＝歷史回顧（角色回顧過去）。
#   novel：小說 ID。
#   source：官方或學術來源網址（P04-2 核准清單）；空字串＝待補證。來源頁面的可存取性仍待補證。
#   source_title：來源名稱（選填）。
# research：史前年代／歷史研究，顯示在 1950 年代之前。
#   period：年代說明（顯示用文字）。phase：歸屬的史前分期 id（選填；沒填＝跨時期研究）。hypothesis: true 表示是研究假說，頁面會標「研究假說」，不能寫成定論。

# 小說故事年代：與可查證的歷史事件分開，不宣稱為真實歷史事件。
