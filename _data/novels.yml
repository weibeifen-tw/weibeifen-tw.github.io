  intro: 2020 年秋天，臺北。高端香水品牌「序」的負責人斂，委託獨立調香師沐做一瓶只屬於她的香水。Alpha 調香師、Omega 品牌主，從試香紙上的停頓開始，慢慢相愛；配方外流、樣品被調包，兩個人一起把事情查清楚。前調會散，中調會變，她想留下的是後調。
