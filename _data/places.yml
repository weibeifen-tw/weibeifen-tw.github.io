# 台灣地圖：每本小說裡真的出現的地點（一句）。沒寫的不顯示。
yu: 大里的三合院，竹子做的球門。
market: 台中的老市場，和市場口的咖啡廳。
feichang: 從彰化的藝術系，搬到台中一起生活。
gongdi: 興大附農和台中高工的機電科。
hue: 台南府城的城西境。
exam: 台北的國考補習班。
yincang: 嘉義的網聚。
shiyi: 中興新村的省府宿舍，和國立中興高中。
chaojian: 雨都基隆，仁愛區的公仔店，頂樓加蓋的鐵皮屋。
weigongkai: 清境山上的實境秀宿舍。
chuwang: 東華大學的戶外排球場，球燈要投錢才會亮。
shuangshuang: 雲林古坑的瓦斯行和廟口小吃。
duanqiao: 末日之後的金門。
huaji: 蘭嶼，工程包商的家和自家民宿。
xiwei: 嘉義市議會，和政治世家的餐桌。
chaosheng: 馬祖南竿的石頭屋和津沙聚落。
houdiao: 中山區的香水公司「序」。
