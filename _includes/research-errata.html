<section class="lit-sec research-errata" data-article="{{ page.article_id | escape }}" data-version="{{ page.version | escape }}"><h2 class="lit-h">文章勘誤</h2><p>已確認勘誤只公開站長審核後的摘要，不公開回報者身分。回報不等同正文修訂。</p><p>勘誤回報功能籌備中，待資料庫安全驗收後開放。</p>{% assign corrections = site.data.research_errata[page.article_id] %}{% if corrections %}<ul>{% for e in corrections %}<li>{{ e.date | escape }}・{{ e.summary | escape }}</li>{% endfor %}</ul>{% endif %}<form class="research-errata-form" hidden><label>問題說明<textarea required maxlength="2000" rows="5"></textarea></label><button class="mb-btn" type="submit">提交私人勘誤</button><p role="status"></p></form></section>
