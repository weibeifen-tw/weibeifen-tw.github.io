<script id="wb-research-index" type="application/json">{
{%- for research_volume in site.data.indigenous_book.volumes -%}
{%- assign research_number = forloop.index -%}
{%- unless forloop.first -%},{%- endunless -%}
{{ '/literature/indigenous/v0' | append: research_number | append: '/' | jsonify }}:{"id":{{ 'indigenous-v0' | append: research_number | jsonify }},"title":{{ research_volume.title | jsonify }},"kind":"volume"}
{%- endfor -%}
{%- for research_article in site.literature -%}
{%- if research_article.series_key == 'indigenous-history' -%}
,{{ research_article.url | jsonify }}:{"id":{{ 'indigenous-v0' | append: research_article.volume_no | jsonify }},"title":{{ research_article.title | jsonify }},"kind":"article","no":{{ research_article.chapter_no | append: '.' | append: research_article.piece | jsonify }},"rank":{{ research_article.chapter_no | times: 100 | plus: research_article.piece }}}
{%- endif -%}
{%- endfor -%}
}</script>
