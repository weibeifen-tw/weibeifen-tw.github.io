title: 未備份
author: 畝 MU
description: 畝 MU 的原創小說網站「未備份」。台灣背景的百合、GL 長篇連載，故事由角色自己發文。
baseurl: ""
url: "https://weibeifen.com"
timezone: Asia/Taipei
lang: zh-Hant
markdown: kramdown
permalink: /t/:title/
exclude:
  - README.md
  - supabase
  # V1.0 S01／S03：開發文件不進網站
  - PROGRESS.md
  - CLAUDE.md
  - AGENTS.md
  - docs
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
# 文學專區（P06）：文章放 _literature/，不進 _posts，不混入首頁動態與 posts.json。
collections:
  literature:
    output: true
    permalink: /literature/:name/
defaults:
  - scope:
      path: ""
      type: literature
    values:
      layout: literature-article
      author: 畝 MU
      description: ""
