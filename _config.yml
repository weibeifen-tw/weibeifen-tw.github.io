title: 未備份
author: 畝 MU
description: 畝 MU 的原創小說網站「未備份」。台灣背景的百合、GL 長篇連載，故事由角色自己發文。
baseurl: ""
url: "https://weibeifen.com"
timezone: Asia/Taipei
lang: zh-Hant
markdown: kramdown
permalink: /t/:title/
# 2026-11-22 小說發布制度：章節日期＝故事時間，不再決定是否公開（日期在未來也照常建置）。
# 是否公開只看兩件事：front matter 沒有 published: false，且列在 .github/release/authorized.txt（部署前驗證）。
future: true
exclude:
  - novel/duanqiao.html
  - novel/huaji.html
  - novel/pendi.html
  - novel/weigongkai.html
  - README.md
  - supabase
  - tests
  # V1.0 S01／S03：開發文件不進網站
  - PROGRESS.md
  - CLAUDE.md
  - AGENTS.md
  - docs
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
# 文學專區（P06）：文章放 _literature/，不進 _posts，不混入首頁動態與 posts.json。
collections:
  literature:
    output: true
    permalink: /literature/:name/
  # 研究文章歷史版本（原住民族專區 DEV-03）：_lit_versions/<文章檔名>/<版本>.md → /literature/<文章檔名>/<版本>/；只存完整正文
  lit_versions:
    output: true
    permalink: /literature/:path/
defaults:
  - scope:
      path: ""
      type: lit_versions
    values:
      layout: lit-version
      sitemap: false
      noindex: true
  - scope:
      path: ""
      type: literature
    values:
      layout: literature-article
      author: 畝 MU
      description: ""
